# Disable NFSv4 client-side directory delegations.
#
# Kernel 7.0 enables directory delegations in the NFS client by default. On
# directory revalidation the client issues GET_DIR_DELEGATION (NFSv4.1 op 46).
# nfs-ganesha does not implement that operation and replies
# NFS4ERR_OP_ILLEGAL (10044). The Linux client has no handler for that error,
# so nfs4_map_errors() falls through to its default case, -EREMOTEIO, and
# returns it from stat(). It does not negative-cache the unsupported
# operation, so it keeps retrying.
#
# Installed on every host regardless of the running kernel, so it is already
# in place when a package upgrade pulls in a 7.0 kernel. On older kernels the
# parameter does not exist and the option is ignored with an
# "unknown parameter ... ignored" message in dmesg; the module still loads.
options nfsv4 directory_delegations=N
